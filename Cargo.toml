[workspace]
resolver = "2"
members = ["crates/term-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "1"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
