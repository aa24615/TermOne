# TermOne CI 流水线
#
# 质量检查：main push 时云端执行类型检查与前端构建
#
# 客户端发版（按钮「发版 Release（客户端）」→ web_trigger_release，输入版本号）：
#   1) create-tag       云端创建并推送 v* 标签
#   2) desktop-windows  自托管 Windows 节点打包 NSIS exe / msi 并上传 Release
#   3) desktop-macos    自托管 macOS 节点打包 dmg 并上传 Release
#   （Release 由上传脚本自动创建，安装包即客户端产物）
#
# 服务端镜像（按钮「发布服务端镜像」→ web_trigger_server_image，独立于客户端发版）：
#   构建并推送 Docker 镜像 v* 与 latest
#
# 按钮定义见 .cnb/web_trigger.yml。
# 桌面端两条流水线依赖根组织自托管构建机（云端节点仅 Linux，无法打包 Win/Mac）:
#   - 接入方式见 https://docs.cnb.cool/zh/build/build-node.md 「根组织自定义 Runner」
#   - Windows 节点标签需含 windows、x64；macOS 节点需含 macos（Apple Silicon 加 arm64）
#   - 构建机需预装 Node.js >= 20 与 Rust 工具链（含平台依赖: MSVC / Xcode CLT）
#   - 自托管节点无 Docker，脚本直接运行在宿主机（Windows 默认 PowerShell）

main:
  push:
    - name: check
      docker:
        image: node:24
      stages:
        - name: install
          script: npm ci --no-audit --no-fund
        - name: typecheck & frontend build
          script: |
            npm run check
            npm run build:desktop
            npm run build:web
            npm run test:desktop

  web_trigger_release:
    - name: create-tag
      stages:
        - name: validate & create tag
          script: |
            VERSION="${VERSION#v}"
            echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' || { echo "版本号不合法: ${VERSION}"; exit 1; }
            git tag "v${VERSION}"
            git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG_LOWERCASE}.git" "v${VERSION}"
            echo "已创建并推送标签 v${VERSION}"

    - name: desktop-windows
      runner:
        namespace: group
        tags: [windows, x64]
      stages:
        - name: toolchain check
          script: |
            node -v
            cargo --version
        - name: install deps
          script: npm ci --no-audit --no-fund
        - name: build bundles
          script: npm run tauri build
        - name: upload to release
          script: |
            $env:RELEASE_TAG = "v$env:VERSION"
            node scripts/upload-release-assets.mjs target/release/bundle

    - name: desktop-macos
      runner:
        namespace: group
        tags: [macos, arm64]
      stages:
        - name: toolchain check
          script: |
            node -v
            cargo --version
        - name: install deps
          script: npm ci --no-audit --no-fund
        - name: build bundles
          script: npm run tauri build
        - name: upload to release
          script: RELEASE_TAG="v${VERSION}" node scripts/upload-release-assets.mjs target/release/bundle

    - name: desktop-linux
      docker:
        image: node:24-bookworm
      stages:
        - name: Linux build dependencies
          script: bash tools/linux/setup.sh
        - name: Linux bundles and tests
          script: |
            export PATH="/root/.cargo/bin:$PATH"
            export CARGO_HTTP_MULTIPLEXING=false
            npm ci --no-audit --no-fund
            npm run check
            npm run test:desktop
            npm run tauri --workspace @termone/desktop -- build --bundles deb,rpm,appimage
            cargo test --workspace --release --locked
        - name: upload Linux bundles
          script: RELEASE_TAG="v${VERSION}" node scripts/upload-release-assets.mjs target/release/bundle

  web_trigger_server_image:
    - name: server-image
      services:
        - docker
      stages:
        - name: validate version
          script: |
            VERSION="${VERSION#v}"
            echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' || { echo "版本号不合法: ${VERSION}"; exit 1; }
            echo "服务端镜像版本: v${VERSION}"
        - name: build image
          script: docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/termone-server:v${VERSION} apps/server
        - name: push image
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/termone-server:v${VERSION}
            docker tag ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/termone-server:v${VERSION} ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/termone-server:latest
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/termone-server:latest
