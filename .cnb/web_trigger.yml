# 发版按钮配置：在 main 分支详情页点击按钮触发对应 web_trigger 事件。
# 按钮语法见 https://docs.cnb.cool/zh/build/web-trigger.md
# 注意: 此文件不支持 include / imports；事件流水线在 .cnb.yml 的 main.* 下定义。
branch:
  - reg: ^main$
    buttons:
      - name: 发版 Release（客户端）
        description: 打包 Windows/macOS 安装包并发布 Release（自动打 v* 标签）
        event: web_trigger_release
        inputs:
          VERSION:
            name: 版本号
            type: input
            required: true
            default: "0.1.0"
            description: 不带 v 前缀（如 0.1.0），将创建 v0.1.0 标签并发布客户端安装包
      - name: 发布服务端镜像
        description: 构建并推送服务端 Docker 镜像（v* 与 latest）
        event: web_trigger_server_image
        inputs:
          VERSION:
            name: 版本号
            type: input
            required: true
            default: "0.1.0"
            description: 镜像标签 v{版本号}，并同时更新 latest
